<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SAML Home</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: #1c2430;
            background: #f4f7fb;
            padding: 2rem;
        }
        main {
            width: min(56rem, 100%);
            margin: 0 auto;
            background: #fff;
            border: 1px solid #d5dde8;
            border-radius: 12px;
            padding: 1.5rem 2rem 2rem;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #d5dde8; padding: 0.55rem 0.7rem; text-align: left; vertical-align: top; }
        th { background: #eef3f9; }
        a { color: #0b6bcb; }
        .actions { margin-top: 1.25rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    </style>
</head>
<body>
<main>
    <h1>Authenticated</h1>
    <p>NameID / principal: <strong th:text="${userId}">user</strong></p>
    <p>Registration: <code th:text="${registrationId}">okta</code></p>

    <table>
        <thead>
        <tr>
            <th>Attribute</th>
            <th>Value(s)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="attribute : ${samlAttributes}">
            <td th:text="${attribute.key}">key</td>
            <td th:text="${attribute.value}">value</td>
        </tr>
        <tr th:if="${#maps.isEmpty(samlAttributes)}">
            <td colspan="2">No attributes were returned by the IdP.</td>
        </tr>
        </tbody>
    </table>

    <div class="actions">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</main>
</body>
</html>
